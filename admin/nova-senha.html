<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nova senha | Aline Martinelli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="../index.html"><img src="../imgs/fotos/logo.png" alt="Aline Martinelli Body Piercer"></a>
        <div>
            <p class="eyebrow">SEGURANÇA</p>
            <h1>Defina sua nova senha</h1>
            <p class="muted">Use pelo menos oito caracteres.</p>
        </div>
        <div id="config-alert" class="alert alert-warning" hidden></div>
        <div id="feedback" class="alert" role="status" aria-live="polite" hidden></div>
        <form id="password-form" class="form-stack">
            <div class="field">
                <label for="new-password">Nova senha</label>
                <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirm-password">Confirme a nova senha</label>
                <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <button id="save-password-button" class="button button-primary" type="submit">Salvar nova senha</button>
        </form>
        <a class="back-link" href="index.html">← Voltar para o login</a>
    </main>
    <script type="module" src="nova-senha.js"></script>
</body>
</html>
